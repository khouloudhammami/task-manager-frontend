<div class="container mt-4">
  <div class="row mb-4">
    <div class="col-12">
      <h2 class="mb-4">
        <i class="fa fa-tasks me-2"></i>Gestionnaire de Tâches
      </h2>
      
      <!-- Barre de recherche et filtres -->
      <div class="card mb-4">
        <div class="card-body">
          <div class="row g-3">
            <div class="col-md-4">
              <input type="text" class="form-control" 
                     [(ngModel)]="searchKeyword"
                     (ngModelChange)="applyFilters()"
                     placeholder="Rechercher une tâche...">
            </div>
            <div class="col-md-3">
              <select class="form-select" [(ngModel)]="filterStatus" (ngModelChange)="applyFilters()">
                <option value="all">Tous les statuts</option>
                <option value="pending">En attente</option>
                <option value="completed">Terminées</option>
              </select>
            </div>
            <div class="col-md-3">
              <select class="form-select" [(ngModel)]="filterPriority" (ngModelChange)="applyFilters()">
                <option value="all">Toutes les priorités</option>
                <option value="LOW">Basse</option>
                <option value="MEDIUM">Moyenne</option>
                <option value="HIGH">Haute</option>
                <option value="URGENT">Urgente</option>
              </select>
            </div>
            <div class="col-md-2">
              <button class="btn btn-primary w-100" routerLink="/tasks/new">
                <i class="fa fa-plus me-1"></i>Nouvelle
              </button>
            </div>
          </div>
        </div>
      </div>
      
      <!-- Loading -->
      <div *ngIf="loading" class="text-center my-4">
        <div class="spinner-border text-primary" role="status">
          <span class="visually-hidden">Chargement...</span>
        </div>
      </div>
      
      <!-- Error -->
      <div *ngIf="error" class="alert alert-danger" role="alert">
        {{ error }}
      </div>
      
      <!-- Liste des tâches -->
      <div *ngIf="!loading && !error">
        <div *ngIf="filteredTasks.length === 0" class="alert alert-info">
          Aucune tâche trouvée
        </div>
        
        <div *ngFor="let task of filteredTasks" class="card mb-3">
          <div class="card-body">
            <div class="d-flex justify-content-between align-items-start">
              <div>
                <h5 class="card-title mb-1">
                  <span [class.text-decoration-line-through]="task.completed">
                    {{ task.title }}
                  </span>
                  <span class="badge ms-2" 
                        [ngClass]="{
                          'bg-secondary': task.priority === 'LOW',
                          'bg-info': task.priority === 'MEDIUM',
                          'bg-warning': task.priority === 'HIGH',
                          'bg-danger': task.priority === 'URGENT'
                        }">
                    {{ task.priority }}
                  </span>
                  <span *ngIf="task.category" class="badge bg-light text-dark ms-1">
                    {{ task.category }}
                  </span>
                </h5>
                <p class="card-text text-muted mb-2">{{ task.description }}</p>
                <small class="text-muted">
                  <i class="fa fa-calendar me-1"></i>
                  Créée le {{ task.createdAt | date:'dd/MM/yyyy' }}
                </small>
              </div>
              <div class="btn-group">
                <button class="btn btn-sm" 
                        [ngClass]="task.completed ? 'btn-success' : 'btn-outline-success'"
                        (click)="onStatusChange(task)">
                  <i class="fa" [ngClass]="task.completed ? 'fa-check-circle' : 'fa-circle'"></i>
                </button>
                <button class="btn btn-sm btn-outline-primary" 
                        [routerLink]="['/tasks', task.id, 'edit']">
                  <i class="fa fa-edit"></i>
                </button>
                <button class="btn btn-sm btn-outline-danger" (click)="deleteTask(task.id)">
                  <i class="fa fa-trash"></i>
                </button>
              </div>
            </div>
          </div>
        </div>
      </div>
    </div>
  </div>
</div>
